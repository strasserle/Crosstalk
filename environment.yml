# Python environment for the stages in coreg_pipeline/.
#   conda env create -f environment.yml && conda activate grn
# The one R script (s02a_build_canonical_candidates.R) needs only base R >= 4.0.
name: grn
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - pandas>=2.0
  - numpy>=1.26
  - scipy>=1.11
  - scikit-learn>=1.3
  - statsmodels>=0.14
  - pyarrow>=14.0
  - requests>=2.31
  - matplotlib>=3.8
  - umap-learn>=0.5
  - pip
  - pip:
      - arboreto>=0.1.6
